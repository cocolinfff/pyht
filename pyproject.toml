[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyht"
version = "0.4.0"
description = "High-Performance Subchannel Thermal-Hydraulic Code"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "CoolProp>=6.4",
]
[project.optional-dependencies]
opt = ["pymoo>=0.6"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["pyht*"]
